name: OpenBazaar
description: >-
  OpenBazaar is an open-source, decentralized peer-to-peer marketplace protocol that let buyers and
  sellers trade goods and services directly with one another using cryptocurrency, with no central
  company, listing fees, or intermediaries taking a cut. Trades were coordinated over a distributed
  network built on IPFS and libp2p, settled with Bitcoin and other cryptocurrencies, and secured with
  multisignature escrow and third-party moderation. The project originated from the DarkMarket
  proof-of-concept and was developed and funded by the company OB1 (backed by a16z, Union Square
  Ventures, and others). The OpenBazaar server daemon exposed a local JSON REST API on the node that
  desktop, mobile, and web clients used to manage listings, orders, wallets, and profiles. OB1 wound
  down commercial operations and the hosted services in early 2021, and the code was open-sourced to the
  community. The openbazaar.org site now advertises an in-development "OpenBazaar 3.0" successor, and the
  GitHub organization hosts the legacy Python (1.0) and Go (2.0) daemons alongside newer Rust and
  browser-based clients.
